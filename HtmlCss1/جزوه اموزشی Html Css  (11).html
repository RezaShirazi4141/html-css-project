<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزوه آموزشی HTML & CSS - چیدمان صفحات (Layout Structure)</title>

    <style>
        /* ریست کردن مارجین و پدینگ پیش‌فرض مرورگر */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, 'Vazirmatn', sans-serif;
            text-align: center;
            font-weight: bold;
            color: #2c3e50;
            background-color: #f4f6f8;
        }

        /* ۱. هدر سایت (Semantic Header) */
        header.site-header {
            background-color: #e74c3c;
            color: #fff;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        /* ۲. محفظه اصلی (Main Layout Container) با استفاده از Flexbox */
        main.main-container {
            display: flex; /* فعال‌سازی سیستم منعطف فلکس‌باکس */
            min-height: 450px;
        }

        /* ستون محتوای اصلی (Content Area) */
        section.content-area {
            flex: 8; /* معادل ۸۰ درصد عرض کل */
            background-color: #f8a5c2;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ستون سایدبار/نوار کناری (Sidebar) */
        aside.sidebar-area {
            flex: 2; /* معادل ۲۰ درصد عرض کل */
            background-color: #a4b0be;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ۳. فوتر سایت (Semantic Footer) */
        footer.site-footer {
            background-color: #f1c40f;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        /* بهینه‌سازی ریسپانسیو برای صفحات موبایل */
        @media (max-width: 768px) {
            main.main-container {
                flex-direction: column; /* در موبایل سایدبار زیر محتوا قرار می‌گیرد */
            }
            section.content-area, aside.sidebar-area {
                width: 100%;
                min-height: 200px;
            }
        }
    </style>
</head>

<body>

    <!-- بخش سربرگ معنایی -->
    <header class="site-header">
        Header (سربرگ سایت)
    </header>

    <!-- بخش اصلی صفحه شامل محتوا و سایدبار -->
    <main class="main-container">
        <!-- ستون محتوا (۸۰٪) -->
        <section class="content-area">
            Content (بخش محتوای اصلی)
        </section>

        <!-- ستون نوار کناری (۲۰٪) -->
        <aside class="sidebar-area">
            Sidebar (نوار کناری / منوها)
        </aside>
    </main>

    <!-- بخش پابرگ معنایی -->
    <footer class="site-footer">
        Footer (پابرگ سایت)
    </footer>

</body>

</html>
