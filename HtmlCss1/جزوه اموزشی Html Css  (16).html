<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزوه جامع - ترکیب چیدمان کامل صفحه (Full Layout Architecture)</title>

    <style>
        /* ریست و تنظیم باکس مدل سراسری */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, 'Vazirmatn', sans-serif;
            background-color: #ecf0f1;
            color: #2c3e50;
            line-height: 1.6;
            padding: 20px 0;
        }

        /* محفظه کلی صفحه */
        .layout-wrapper {
            max-width: 1000px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            background-color: #fff;
        }

        /* ۱. بخش سربرگ (Header) */
        header.site-header {
            background: linear-gradient(135deg, #e74c3c, #8e44ad);
            color: white;
            padding: 20px;
        }

        nav.header-nav ul {
            display: flex;
            list-style: none;
            gap: 15px;
            margin-bottom: 15px;
        }

        nav.header-nav a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.2);
            transition: 0.3s;
        }

        nav.header-nav a:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* ۲. بدنه میانی (Main Layout با Flexbox) */
        main.main-body {
            display: flex;
            min-height: 480px;
            gap: 15px;
            padding: 15px;
            background-color: #f8f9fa;
        }

        /* سایدبار کناری (Sidebar) */
        aside.site-sidebar {
            flex: 0 0 30%; /* ۳۰ درصد عرض بدون جمع و تفریق دستی */
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
        }

        /* محتوای اصلی (Main Content) */
        section.site-content {
            flex: 1; /* ۷۰ درصد باقیمانده را خودکار پر می‌کند */
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
        }

        /* بهینه‌سازی آی‌فریم‌ها */
        .frame-embed {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ۳. پابرگ و فرم پیشرفته (Footer Form) */
        footer.site-footer {
            background-color: #2c3e50;
            color: #fff;
            padding: 25px;
        }

        fieldset.footer-fieldset {
            border: 1px solid #7f8c8d;
            border-radius: 8px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        legend {
            padding: 0 10px;
            font-weight: bold;
            color: #f1c40f;
        }

        /* چیدمان المان‌های فرم به صورت تمیز و مدرن با CSS Grid (جایگزین جدول) */
        .form-grid {
            display: grid;
            grid-template-columns: 100px 1fr; /* ستون اول عنوان، ستون دوم ورودی */
            gap: 12px;
            align-items: center;
        }

        .form-grid label {
            font-size: 0.9rem;
        }

        .form-grid input[type="text"],
        .form-grid input[type="password"],
        .form-grid input[type="email"],
        .form-grid textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-family: inherit;
        }

        .form-grid textarea {
            height: 70px;
            resize: vertical;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .form-actions {
            grid-column: 1 / -1; /* دکمه‌ها تمام عرض دو ستون را می‌گیرند */
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .form-actions input {
            padding: 8px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-submit {
            background-color: #27ae60;
            color: white;
        }

        .btn-reset {
            background-color: #e74c3c;
            color: white;
        }

        /* ریسپانسیو برای نمایشگرهای زیر ۷۶۸ پیکسل (موبایل و تبلت) */
        @media (max-width: 768px) {
            main.main-body {
                flex-direction: column;
            }
            aside.site-sidebar {
                min-height: 250px;
            }
            .form-grid {
                grid-template-columns: 1fr; /* تک‌ستونه شدن فرم در موبایل */
            }
        }
    </style>
</head>

<body>

    <div class="layout-wrapper">
        
        <!-- ۱. سربرگ سایت -->
        <header class="site-header">
            <nav class="header-nav">
                <ul>
                    <li><a href="#register-section">فرم ثبت‌نام</a></li>
                    <li><a href="#content-section">محتوای اصلی</a></li>
                </ul>
            </nav>
            <div class="header-intro">
                <h2>طراحی یکپارچه چیدمان وب (Master Layout)</h2>
                <p>در این صفحه سربرگ، بدنه فلکس، آی‌فریم و فرم اعتبارسنجی در قالبی استاندارد تجمیع شده‌اند.</p>
            </div>
        </header>

        <!-- ۲. بدنه میانی (سایدبار و محتوا) -->
        <main class="main-body" id="content-section">
            <aside class="site-sidebar">
                <iframe src="https://www.digikala.com/" class="frame-embed" loading="lazy" title="نوار کناری"></iframe>
            </aside>

            <section class="site-content">
                <iframe src="https://www.digikala.com/" class="frame-embed" loading="lazy" title="محتوای اصلی"></iframe>
            </section>
        </main>

        <!-- ۳. فوتر همراه با فرم مدرن و بدون جدول -->
        <footer class="site-footer" id="register-section">
            <fieldset class="footer-fieldset">
                <legend>فرم عضویت سریع</legend>
                
                <form action="/submit-form/" method="POST">
                    <div class="form-grid">
                        <label for="u_name">نام کاربری:</label>
                        <input type="text" id="u_name" name="username" maxlength="15" placeholder="نام کاربری..." required>

                        <label for="u_pass">رمز عبور:</label>
                        <input type="password" id="u_pass" name="password" maxlength="20" placeholder="••••••••" required>

                        <label for="u_email">ایمیل:</label>
                        <input type="email" id="u_email" name="email" placeholder="user@example.com" required>

                        <label for="u_address">آدرس:</label>
                        <textarea id="u_address" name="address" placeholder="نشانی دقیق..."></textarea>

                        <label>شغل:</label>
                        <div class="radio-group">
                            <label><input type="radio" name="job" value="doctor"> پزشک</label>
                            <label><input type="radio" name="job" value="police"> پلیس</label>
                            <label><input type="radio" name="job" value="developer" checked> برنامه‌نویس</label>
                        </div>

                        <div class="form-actions">
                            <input type="submit" class="btn-submit" value="ارسال اطلاعات">
                            <input type="reset" class="btn-reset" value="پاک کردن">
                        </div>
                    </div>
                </form>
            </fieldset>
        </footer>

    </div>

</body>
</html>
