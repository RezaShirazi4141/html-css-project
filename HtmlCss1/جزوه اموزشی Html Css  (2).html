<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <!-- متاداده‌ها و عنوان صفحه -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>جزوه آموزشی HTML - نقشه تصویری (Image Map)</title>
  </head>

  <body>
    <!-- =================================================================
         بخش نقشه تصویری (Image Map)
         مفهوم: تبدیل بخش‌های مختلف یک عکس به لینک‌های مجزا و قابل کلیک
         ================================================================= -->

    <!-- 
      تگ <img>:
      صفت usemap: نام نقشه‌ای که قراره به این تصویر متصل بشه رو مشخص می‌کنه.
      ⚠️ نکته مهم: همیشه قبل از نام نقشه باید علامت هشتگ (#) قرار بگیرد (#mymap).
    -->
    <img
      src="../HtmlCss1/asser/img/imgmap.png"
      alt="نقشه اشکال هندسی"
      usemap="#mymap"
    />

    <!-- 
      تگ <map>:
      نقشه تصویری را تعریف می‌کند و صفت name نام نقشه را مشخص می‌کند (هم‌نام با مقدار usemap).
    -->
    <map name="mymap">
      <!-- 
          ۱. ناحیه مستطیلی (rect = Rectangle):
          shape="rect"
          coords="x1, y1, x2, y2"
          -> x1, y1: مختصات گوشه بالا سمت چپ
          -> x2, y2: مختصات گوشه پایین سمت راست
        -->
      <area
        shape="rect"
        coords="186,99,510,342"
        href="https://www.digikala.com/"
        alt="بخش مستطیل"
        target="_blank"
      />

      <!-- 
          ۲. ناحیه دایره‌ای (circle = Circle):
          shape="circle"
          coords="x, y, r"
          -> x, y: مختصات مرکز دایره
          -> r: شعاع دایره (Radius) به پیکسل
        -->
      <area
        shape="circle"
        coords="820,222,140"
        href="https://www.digikala.com/"
        alt="بخش دایره"
        target="_blank"
      />

      <!-- 
          ۳. ناحیه چندضلعی (poly = Polygon):
          شامل مثلث، لوزی، ستاره یا هر شکل نامنظم.
          shape="poly"
          coords="x1, y1, x2, y2, x3, y3, ..."
          -> مختصات رأس‌های شکل (مثلاً مثلث ۳ رأس = ۶ عدد دارد)
        -->
      <area
        shape="poly"
        coords="1337,107,1186,339,1493,333"
        href="https://www.digikala.com/"
        alt="بخش مثلث (چندضلعی)"
        target="_blank"
      />

      <!-- 
          ۴. کل تصویر به عنوان حالت پیش‌فرض (default) - اختیاری:
          اگر کاربر روی هیچ‌کدام از اشکال بالا کلیک نکرد، این لینک فعال می‌شود.
        -->
      <!-- <area shape="default" href="https://example.com" alt="سایر بخش‌ها"> -->
    </map>

    <!-- 
      📌 ابزار کمکی برای توسعه‌دهندگان:
      برای اینکه مجبور نباشی مختصات پیکسل‌ها (coords) رو دستی حساب کنی،
      از ابزارهای آنلاینی مثل image-map.net استفاده می‌کنی؛ 
      عکست رو آپلود می‌کنی، شکل‌ها رو می‌کشی و کد آماده رو تحویل می‌گیری.
    -->
  </body>
</html>
