<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزوه آموزشی CSS - ویژگی Transition و انواع Timing Function</title>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, 'Vazirmatn', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin-bottom: 8px;
            color: #38bdf8;
        }

        p.desc {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        /* کانتینر مسابقه باکس‌ها */
        .stage {
            width: 100%;
            max-width: 800px;
            background-color: #1e293b;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .track {
            position: relative;
            background: #0f172a;
            border-radius: 8px;
            padding: 6px 12px;
            border: 1px dashed #475569;
        }

        .box {
            width: 130px;
            height: 44px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            /* تعریف ترنزیشن با مشخص کردن دقیق پراپرتی و مدت زمان */
            transition-property: transform, background-color;
            transition-duration: 1.5s;
        }

        /* هر باکس با یک منحنی شتاب متفاوت */
        .box-linear      { background-color: #ef4444; transition-timing-function: linear; }
        .box-ease        { background-color: #f59e0b; transition-timing-function: ease; }
        .box-ease-in     { background-color: #10b981; transition-timing-function: ease-in; }
        .box-ease-out    { background-color: #06b6d4; transition-timing-function: ease-out; }
        .box-ease-in-out { background-color: #8b5cf6; transition-timing-function: ease-in-out; }
        .box-bounce      { background-color: #ec4899; transition-timing-function: cubic-bezier(0.68, -0.55, 0.265, 1.55); }

        /* وقتی روی استیج هاور می‌شود، تمام باکس‌ها همزمان به سمت راست حرکت می‌کنند */
        .stage:hover .box {
            transform: translateX(-480px); /* در حالت RTL حرکت به سمت چپ/انتهای کانتینر */
        }
    </style>
</head>

<body>

    <h2>مقایسه توابع سرعت (Timing Functions) در Transition</h2>
    <p class="desc">ماوس را روی کادر زیر ببرید تا تفاوت شتاب حرکت و ترمز باکس‌ها را مشاهده کنید:</p>

    <div class="stage">
        <div class="track"><div class="box box-linear">linear (ثابت)</div></div>
        <div class="track"><div class="box box-ease">ease (پیش‌فرض)</div></div>
        <div class="track"><div class="box box-ease-in">ease-in (شروع آرام)</div></div>
        <div class="track"><div class="box box-ease-out">ease-out (ترمز ملایم)</div></div>
        <div class="track"><div class="box box-ease-in-out">ease-in-out (نرم دوطرفه)</div></div>
        <div class="track"><div class="box box-bounce">cubic-bezier (جهشی)</div></div>
    </div>

</body>
</html>
