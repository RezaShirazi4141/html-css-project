<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزوه آموزشی CSS - ویژگی box-shadow و انیمیشن‌ها</title>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, 'Vazirmatn', sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin-bottom: 30px;
            color: #38bdf8;
        }

        .showcase {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            height: 180px;
            background-color: #1e293b;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 16px;
            font-size: 0.9rem;
            transition: transform 0.3s ease;
        }

        /* ۱. سایه نرم مدرن چند لایه (Elevation Layering) */
        .card-modern {
            box-shadow: 
                0 10px 15px -3px rgba(0, 0, 0, 0.3),
                0 4px 6px -4px rgba(0, 0, 0, 0.2);
        }
        .card-modern:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 20px 25px -5px rgba(0, 0, 0, 0.4),
                0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        /* ۲. سایه داخلی (Inset Shadow) برای حس فرورفتگی دکمه */
        .card-inset {
            background-color: #0f172a;
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.7);
            border: 1px solid #334155;
        }

        /* ۳. افکت نئونی با انیمیشن Glow Pulse */
        .card-glow {
            border: 2px solid #38bdf8;
            animation: pulseGlow 2s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
            }
            100% {
                box-shadow: 0 0 30px rgba(56, 189, 248, 0.8), 0 0 60px rgba(56, 189, 248, 0.4);
            }
        }
    </style>
</head>

<body>

    <h2>کاربردهای حرفه‌ای Box-Shadow و انیمیشن در UI</h2>

    <div class="showcase">
        <div class="card card-modern">
            <strong>سایه مدرن چندلایه</strong>
            <span>(طبیعی و نرم با چند لایه RGBA)</span>
        </div>

        <div class="card card-inset">
            <strong>سایه فرورفته (Inset)</strong>
            <span>(ایجاد عمق به سمت داخل کارت)</span>
        </div>

        <div class="card card-glow">
            <strong>انیمیشن نئونی (Glow)</strong>
            <span>(تغییر پویای سایه با @keyframes)</span>
        </div>
    </div>

</body>
</html>
