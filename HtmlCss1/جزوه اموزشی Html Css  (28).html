<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزوه آموزشی CSS - پس‌زمینه ویدیویی تمام‌صفحه</title>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, 'Vazirmatn', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* کانتینر اصلی بخش Hero */
        .hero-container {
            position: relative;
            width: 100%;
            height: 100vh; /* پوشش کل ارتفاع صفحه نمایش */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* استایل تگ ویدیو */
        .background-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%); /* مرکز نگه داشتن همیشگی ویدیو */
            object-fit: cover;
            z-index: -2;
        }

        /* لایه پوششی تاریک (Dark Overlay) */
        .hero-container::after {
            content: "";
            position: absolute;
            inset: 0; /* معادل top:0; left:0; right:0; bottom:0; */
            background: rgba(15, 23, 42, 0.65); /* تیرگی برای خوانایی حداکثری متن */
            backdrop-filter: blur(1px); /* افکت مات‌شدگی بسیار ملایم */
            z-index: -1;
        }

        /* محتوای روی ویدیو */
        .hero-content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 20px;
            max-width: 800px;
        }

        .hero-content h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 16px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            letter-spacing: -0.5px;
        }

        .hero-content p {
            font-size: 1.2rem;
            color: #cbd5e1;
            margin-bottom: 28px;
            line-height: 1.8;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
        }

        .cta-btn {
            display: inline-block;
            padding: 12px 32px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -5px rgba(37, 99, 235, 0.7);
        }

        /* احترام به کاربرانی که درخواست کاهش حرکات دارند */
        @media (prefers-reduced-motion: reduce) {
            .background-video {
                display: none;
            }
            .hero-container {
                background: #1e293b;
            }
        }
    </style>
</head>

<body>

    <header class="hero-container">
        <!-- 
            صفت‌های کلیدی:
            - autoplay: شروع خودکار
            - muted: بی‌صدا (الزامی برای autoplay در تمام مرورگرها)
            - loop: تکرار مداوم
            - playsinline: جلوگیری از فول‌اسکرین شدن اجباری در آیفون/iOS
            - poster: تصویر جایگزین تا زمان لود ویدیو
        -->
        <video autoplay muted loop playsinline poster="fallback-poster.jpg" class="background-video">
            <source src="gojo-vs-sukuna.mp4" type="video/mp4">
            مرورگر شما از تگ ویدیو پشتیبانی نمی‌کند.
        </video>

        <div class="hero-content">
            <h1>خوش آمدید آقای مهندس</h1>
            <p>پیاده‌سازی هدرهای مدرن با ویدیوهای سینمایی در پس‌زمینه و لایه‌بندی استاندارد CSS</p>
            <a href="#explore" class="cta-btn">مشاهده دوره‌ها</a>
        </div>
    </header>

</body>
</html>
