<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزوه آموزشی HTML - قاب‌های توکار (iFrame)</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            line-height: 1.8;
            padding: 20px;
        }

        /* بهترین روش کنترل ظاهر آی‌فریم با CSS */
        .styled-frame {
            border: 2px solid #b94829;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>

<body>

    <!-- =================================================================
         تگ <iframe> (Inline Frame)
         کاربرد: جاسازی (Embed) یک صفحه وب، ویدیو (آپارات/یوتیوب)، 
         نقشه (گوگل‌مپ) یا هر فایل HTML دیگر در داخل صفحه وب فعلی.
         ================================================================= -->
    <h2>نمونه آی‌فریم استاندارد</h2>

    <!--
      ویژگی‌های مهم <iframe>:
      1. src: آدرس صفحه وب یا منبعی که قراره نمایش داده بشه.
      2. width و height: ابعاد کادر به پیکسل (عدد خالص بدون px در صفات HTML).
      3. title: توضیح کوتاه درباره محتوای فریم (برای دسترس‌پذیری و سئو ضروری است).
      4. loading="lazy": بهینه‌سازی سرعت؛ لود فریم تا زمانی که کاربر به آن نرسیده متوقف می‌ماند.
      5. frameborder="0": برای حذف کادر پیش‌فرض (در HTML5 با CSS کنترل می‌شود).
    -->
    <iframe class="styled-frame"
            src="https://www.digikala.com/" 
            title="سایت دیجی کالا"
            width="600" 
            height="400"
            loading="lazy">
        <!-- متن جایگزین برای مرورگرهای خیلی قدیمی که از iframe پشتیبانی نمی‌کنند -->
        مرورگر شما از آی‌فریم پشتیبانی نمی‌کند.
    </iframe>

    <hr>

    <!-- =================================================================
         ترفند کاربردی: باز کردن لینک‌ها درون یک آی‌فریم مشخص
         ================================================================= -->
    <h3>هدایت لینک‌ها به درون آی‌فریم</h3>
    <p>با کلیک روی لینک زیر، صفحه مقصد به جای باز شدن در پنجره جدید، در کادر فریم پایین باز می‌شود:</p>

    <!-- 
      نکته طلایی: 
      صفت target در تگ <a> باید دقیقاً با صفت name در تگ <iframe> یکسان باشد!
    -->
    <p>
        <a href="https://www.digikala.com/" target="my-display-frame">
            باز کردن دیجی کالا درون کادر زیر
        </a>
    </p>

    <iframe name="my-display-frame" 
            title="نمایشگر لینک‌ها"
            width="600" 
            height="300"
            style="border: 1px dashed #22acb3;">
    </iframe>

</body>

</html>
