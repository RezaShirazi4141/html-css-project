<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <!-- =================================================================
         ۱. متاتگ‌های فنی و ضروری (Technical & Responsive)
         ================================================================= -->

    <!-- انکودینگ کاراکترها: جلوگیری از به هم ریختن حروف فارسی، عربی و ایموجی‌ها -->
    <meta charset="UTF-8">

    <!-- سازگاری با نمایشگرهای موبایل و تبلت (Responsive Web Design) -->
    <!-- width=device-width: عرض صفحه را برابر با عرض فیزیکی دستگاه قرار می‌دهد -->
    <!-- initial-scale=1.0: سطح زوم اولیه صفحه را روی ۱۰۰٪ تنظیم می‌کند -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- عنوان صفحه (Tab Title): مهم‌ترین عامل متنی در سئو و بوکمارک‌ها -->
    <title>جزوه آموزشی HTML - آناتومی تگ Head و متادیتاها</title>


    <!-- =================================================================
         ۲. متاتگ‌های پایه سئو (SEO Metadata)
         ================================================================= -->

    <!-- توضیحات صفحه: همان متنی که گوگل زیر لینک سایت در نتایج جستجو نمایش می‌دهد (بهترین طول: بین ۱۲۰ تا ۱۶۰ کاراکتر) -->
    <meta name="description" content="راهنمای جامع و اصولی ساختار بخش head و معرفی متاتگ‌های استاندارد سئو و دسترسی‌پذیری.">

    <!-- کلمات کلیدی: خزنده‌های مدرن گوگل به دلیل سوءاستفاده‌های قدیمی دیگر به این تگ وزنی نمی‌دهند، اما همچنان در برخی موتورهای داخلی کاربرد دارد -->
    <meta name="keywords" content="آموزش HTML, متاتگ, طراحی سایت, سئو فرانت اند">

    <!-- معرفی طراح، توسعه‌دهنده یا صاحب حق اثر صفحه -->
    <meta name="author" content="مهندس میلاد">

    <!-- مدیریت خزنده‌های گوگل (Robots): index یعنی صفحه را ذخیره کن، follow یعنی لینک‌های داخلی آن را دنبال کن -->
    <meta name="robots" content="index, follow">

    <!-- آدرس مرجع یا کانونیکال (Canonical): جلوگیری از جریمه محتوای تکراری (Duplicate Content) در موتورهای جستجو -->
    <link rel="canonical" href="https://example.com/html-head-guide">


    <!-- =================================================================
         ۳. متاتگ‌های شبکه‌های اجتماعی (Open Graph - فیس‌بوک، تلگرام، لینکدین)
         این تگ‌ها تعیین می‌کنند هنگام اشتراک‌گذاری لینک در پیام‌رسان‌ها چه کارتی نمایش داده شود.
         ================================================================= -->
    <meta property="og:title" content="آموزش متاتگ‌های تگ Head در HTML">
    <meta property="og:description" content="یادگیری جامع مفاهیم و متاتگ‌های بهینه‌سازی شده برای توسعه‌دهندگان وب.">
    <meta property="og:image" content="https://example.com/assets/images/cover.jpg">
    <meta property="og:url" content="https://example.com">
    <meta property="og:type" content="article">


    <!-- =================================================================
         ۴. اتصال منابع خارجی (استایل‌ها، فونت‌ها، آیکون و اسکریپت‌ها)
         ================================================================= -->

    <!-- فاوآیکون (Favicon): آیکون کوچکی که در تب مرورگر کنار عنوان صفحه دیده می‌شود -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <!-- آیکون با کیفیت برای ذخیره سایت روی صفحه اصلی گوشی‌های آیفون -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- اتصال فایل استایل‌های خارجی (CSS) -->
    <!-- نکته: در HTML5 نیازی به نوشتن type="text/css" نیست -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- 
      اتصال فایل جاوااسکریپت:
      ویژگی defer باعث می‌شود دانلود فایل در پس‌زمینه انجام شود و اجرای آن به پس از بارگذاری کامل سند موکول گردد؛
      این کار سرعت لود صفحه (First Contentful Paint) را به شدت افزایش می‌دهد.
    -->
    <script src="assets/js/main.js" defer></script>

</head>

<body>

    <header>
        <h1>آشنایی با متادیتاها و تگ &lt;head&gt;</h1>
    </header>

    <main>
        <p>محتوای متادیتاها مستقیماً به کاربر نمایش داده نمی‌شود، اما اطلاعات ضروری را به مرورگرها و موتورهای جستجو منتقل می‌کند.</p>
    </main>

</body>

</html>
