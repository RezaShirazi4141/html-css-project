<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود به سیستم | پنل مدیریت پروژه</title>
    <link rel="stylesheet" href="/HtmlCss2/asser/css/project4.css" />
  </head>
  <body>
    <main class="container">
      <section class="right">
        <div class="right-info">
          <h2>خوش آمدید</h2>
          <p>امروز روز جدیدی است. وارد شوید و پروژه‌های خود را مدیریت کنید.</p>

          <form action="#" method="POST">
            <div class="form-group">
              <label for="email">ایمیل</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="example@gmail.com"
                required
                autocomplete="email"
              />
            </div>

            <div class="form-group">
              <label for="password">رمز عبور</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="حداقل ۸ کاراکتر"
                required
                autocomplete="current-password"
              />
            </div>

            <a href="#" class="forgot-password"
              >رمز عبور خود را فراموش کردید؟</a
            >

            <button type="submit" class="btn">ورود</button>
          </form>

          <p class="or-text">یا</p>

          <div class="social-buttons">
            <button type="button" class="social-btn">
              <img
                src="../HtmlCss2/asser/img4/project4 (1).jpg"
                alt="Google"
                width="20"
                height="20"
              />
              <span class="span">ورود با گوگل</span>
              <span class="span-sm">گوگل</span>
            </button>

            <button type="button" class="social-btn">
              <img
                src="../HtmlCss2/asser/img4/project4 (1).png"
                alt="Facebook"
                width="20"
                height="20"
              />
              <span class="span">ورود با فیسبوک</span>
              <span class="span-sm">فیسبوک</span>
            </button>
          </div>

          <p class="signup-text">
            حساب کاربری ندارید؟ <a href="#">ثبت نام کنید</a>
          </p>
        </div>
      </section>

      <section class="left">
        <img src="../HtmlCss2/asser/img4/RSH.png" class="reza" alt="بنر لاگین" />
      </section>
    </main>
  </body>
</html>
