<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مدیریت کارهای روزانه</title>
    <link rel="stylesheet" href="/HtmlCss2/asser/css/project5.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <main class="container">
      <section class="profil-section">
        <div class="avatar-wrapper">
          <img
            src="/HtmlCss2/asser/img5/RSH.png"
            alt="پروفایل رضا"
            class="profil-img"
          />
        </div>
        <h2 class="username">رضا</h2>
        <p class="handle">@reza</p>
        <button class="logout" type="button">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> خروج
        </button>
      </section>

      <section class="todo-section">
        <div class="clock-container">
          <div class="clock">
            <div class="clock-pin"></div>
            <div class="hand hour-hand"></div>
            <div class="hand minute-hand"></div>
            <div class="hand second-hand"></div>
          </div>
          <h5 class="greeting">عصر بخیر</h5>
        </div>

        <div class="task-container">
          <div class="task-header">
            <p class="task-title">لیست کارها</p>
            <button class="add-btn" type="button" title="افزودن کار جدید">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>

          <div class="task-list">
            <label class="task">
              <input type="checkbox" />
              <span class="checkmark"></span>
              <span class="task-text">پخت برنج و مرغ ساعت ۱۰ صبح</span>
            </label>

            <label class="task">
              <input type="checkbox" />
              <span class="checkmark"></span>
              <span class="task-text">ساعت ۱۲ ظهر HTML و CSS</span>
            </label>

            <label class="task">
              <input type="checkbox" />
              <span class="checkmark"></span>
              <span class="task-text">ناهار خوردن ساعت ۱ ظهر</span>
            </label>

            <label class="task">
              <input type="checkbox" />
              <span class="checkmark"></span>
              <span class="task-text">ساعت ۳ بعد از ظهر JavaScript</span>
            </label>

            <label class="task">
              <input type="checkbox" />
              <span class="checkmark"></span>
              <span class="task-text">شام خوردن ساعت ۸ شب</span>
            </label>

            <label class="task">
              <input type="checkbox" />
              <span class="checkmark"></span>
              <span class="task-text">پیاده‌روی ساعت ۹ شب</span>
            </label>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
