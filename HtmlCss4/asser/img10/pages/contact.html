<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تماس با ما</title>
    <link rel="stylesheet" href="/HtmlCss3/asser/css/project10.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <script src="/HtmlCss4/asser/img10/js/theme.js"></script>
  </head>

  <body>
    <header class="header">
      <div class="container flex-space-between">
        <span class="logo">وبلاگ RSH</span>
        <nav class="nav">
          <a href="/HtmlCss4/project10.html">خانه</a>
          <a href="../pages/categories.html">دسته‌بندی‌ها</a>
          <a href="../pages/about.html">درباره من</a>
          <a href="../pages/contact.html">تماس با ما</a>
          <button
            id="theme-toggle"
            class="theme-toggle"
            aria-label="تغییر تم"
            type="button"
          >
            <span class="sun-icon">☀️</span>
            <span class="moon-icon">🌙</span>
          </button>
        </nav>
      </div>
    </header>

    <section class="container contact-page">
      <h1>تماس با ما</h1>
      <form class="contact-form">
        <label for="name">نام:</label>
        <input type="text" id="name" name="name" required />

        <label for="email">ایمیل:</label>
        <input type="email" id="email" name="email" required />

        <label for="message">پیام:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit" class="btn">ارسال پیام</button>
      </form>
    </section>

    <footer class="footer">
      <div class="container flex-space-between">
        <p>طراحی در 2026 💛</p>
        <div class="socials">
          <a href="#"><i class="fa-brands fa-instagram"></i></a>
          <a href="#"><i class="fa-brands fa-twitter"></i></a>
          <a href="#"><i class="fa-brands fa-linkedin"></i></a>
        </div>
      </div>
    </footer>
  </body>
</html>
